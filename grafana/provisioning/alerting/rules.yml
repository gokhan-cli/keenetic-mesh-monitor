apiVersion: 1

# Her kural: A = Prometheus sorgusu, B = eşik (A > 0 ya da A < 1).
# Sorun yoksa sorgu boş dönebilir; bu yüzden noDataState: OK.

groups:
  - orgId: 1
    name: keenetic
    folder: Keenetic
    interval: 1m
    rules:
      - uid: keenetic-down
        title: Router'a erişilemiyor
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "🔴 Router'a erişilemiyor"
          description: "Exporter 5 dakikadır controller'dan veri alamıyor (router kapalı, ağ sorunu ya da giriş hatası). Kontrol: docker logs keenetic-exporter"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Exporter ayaktaysa keenetic_up, değilse scrape durumu (up)
              expr: '1 - (keenetic_up or up{job="keenetic"} * 0)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-member-lost
        title: Mesh üyesi kayboldu
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "🔴 Mesh üyesi kayboldu: {{ .Labels.name }}"
          description: "{{ .Labels.name }} ({{ .Labels.mac }}) mesh listesinde yok ya da internete erişemiyor."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Son 1 saatte görülüp şimdi listede olmayan üyeler (router erişilebilirken),
              # ya da listede olup interneti olmayanlar
              expr: >-
                (count by (mac, name) (max_over_time(keenetic_mesh_member_info[1h]))
                  unless on(mac) keenetic_mesh_member_info
                  and on() keenetic_up == 1)
                or (1 - keenetic_mesh_member_internet_available) > 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-backhaul-reset
        title: Mesh bağlantısı yeniden kuruldu
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "🟠 Mesh bağlantısı yeniden kuruldu: {{ .Labels.name }}"
          description: "{{ .Labels.name }} mesh bağlantısı son 10 dakikada koptu ve yeniden kuruldu."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'resets(keenetic_mesh_backhaul_uptime_seconds[10m])'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-width-degraded
        title: Kanal genişliği düştü
        condition: B
        # Yeniden başlatma sonrası DFS dinlemesi (CAC) ~10 dk sürer
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "🟠 Kanal genişliği düştü: {{ .Labels.device }} {{ .Labels.band }}"
          description: "{{ .Labels.device }} {{ .Labels.band }} radyosu 15 dakikadır ayarlanandan dar çalışıyor (oran {{ .Values.A }}). 5 GHz'te genelde radar (DFS) sonrası olur; mesh bağlantı hızı da düşer."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'keenetic_radio_channel_width_mhz / keenetic_radio_channel_width_configured_mhz'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: keenetic-internet-down
        title: İnternet bağlantısı yok
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "🔴 İnternet bağlantısı yok"
          description: "Router 2 dakikadır internete erişemiyor. Bu mesaj bağlantı gelince iletilir; kesintinin başlangıcı Olay Saati'dir."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Router kendi kontrolünü yapar (ağ geçidi, DNS, captive)
              expr: '1 - keenetic_internet_up'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-pingcheck-failing
        title: Ping kontrolü başarısız, hat açık
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "🟠 Ping kontrolü başarısız: {{ .Labels.interface }}"
          description: "{{ .Labels.interface }} bağlı ve ağ geçidi yanıt veriyor, ama ping kontrolü 3 dakikadır başarısız. Router bu durumda IPv4 rotasını kapatıp açar: paket kaybı olur, VPN'ler kopar. Kontrol hedefi erişilemiyor olabilir (Otomatik modda captive.keenetic.net); İnternet → bağlantı ayarları → Ping Check'te hedef olarak 8.8.8.8 ve 1.1.1.1 gibi adresler girin."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Hattın kendisi sağlamken kontrol hedefinin erişilemediği durum (21 Ekim 2026'daki gibi)
              expr: >-
                (1 - keenetic_pingcheck_pass)
                * on(interface) group_left() (keenetic_wan_up == 1)
                and on() (keenetic_internet_check{check="gateway"} == 1)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-wan-reconnect
        title: İnternet yeniden bağlandı
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "🟠 İnternet bağlantısı yeniden kuruldu: {{ .Labels.interface }}"
          description: "{{ .Labels.interface }} bağlantısı son 10 dakikada koptu ve yeniden kuruldu (PPPoE oturumu yenilendi)."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'resets(keenetic_wan_uptime_seconds[10m])'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-device-reboot
        title: Cihaz yeniden başladı
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "🟠 Yeniden başladı: {{ .Labels.device }}"
          description: "{{ .Labels.device }} son 10 dakikada yeniden başladı (elektrik kesintisi, güncelleme ya da çökme)."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'resets(keenetic_system_uptime_seconds[10m])'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-vpn-down
        title: VPN bağlantısı koptu
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "🔴 VPN bağlantısı koptu: {{ .Labels.name }}"
          description: "{{ .Labels.name }} ({{ .Labels.interface }}) açık ama 3 dakikadır bağlı değil."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Ayarda kapalı tüneller uyarı üretmez
              expr: 'keenetic_vpn_enabled == 1 and keenetic_vpn_up == 0'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-radio-hot
        title: Radyo sıcaklığı yüksek
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "🟠 Radyo ısınıyor: {{ .Labels.device }} {{ .Labels.band }}"
          description: "{{ .Labels.device }} {{ .Labels.band }} radyosu 15 dakikadır 80 °C üzerinde ({{ .Values.A }} °C). Normalde 50–65 °C; cihazın havalandırmasını ve üstünün kapalı olmadığını kontrol edin."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Son 5 günde en yüksek 64 °C görüldü; eşik buna göre seçildi
              expr: 'max by (device, band) (keenetic_radio_temperature_celsius)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      - uid: keenetic-firmware-update
        title: Yazılım güncellemesi var
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: info }
        annotations:
          summary: "🔵 Yazılım güncellemesi var: {{ .Labels.device }}"
          description: "{{ .Labels.device }} için {{ .Labels.channel }} kanalında {{ .Labels.available }} sürümü yayınlandı. Exporter güncelleme kurmaz; kurulum router arayüzünden yapılır."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'keenetic_firmware_update_available'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-login-blocked
        title: Giriş denemesi engellendi
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "🔴 Hatalı giriş nedeniyle IP engellendi: {{ .Labels.device }} {{ .Labels.protocol }}"
          description: "{{ .Labels.device }} üzerinde {{ .Labels.protocol }} için {{ .Values.A }} IP engellendi (art arda hatalı şifre). IP adresi router'da Tanılama → Sistem Günlüğü'nde \"ban remote host\" satırında görünür; exporter router günlüğünü okuyabiliyorsa bunun yerine IP'li \"IP engellendi\" uyarısı gelir. Exporter'ın şifresi değiştiyse sebep o olabilir."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Router günlüğünden IP'li uyarı gelen engeller tekrar bildirilmez (aşağıdaki kural).
              # Router engeli birkaç saniye geç kaldırıyor, sayaç da dakikada bir okunuyor;
              # bu yüzden engel bittikten sonra 5 dk daha susulur.
              expr: 'keenetic_lockout_current_blocked unless on(device) (keenetic_security_ban_until_seconds - time() > -300)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-ip-banned
        title: IP engellendi
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "🔴 IP engellendi: {{ .Labels.ip }} → {{ .Labels.device }} {{ .Labels.protocol }}"
          description: "{{ .Labels.device }}, {{ .Labels.ip }} adresini {{ .Labels.protocol }} için engelledi (art arda hatalı giriş ya da kötü niyetli istek).{{ if .Labels.paths }} Son istekler: {{ .Labels.paths }}{{ end }} IP bilgisi: https://www.abuseipdb.com/check/{{ .Labels.ip }}"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Router günlüğündeki "ban remote host" satırları; değer = kalan süre (sn)
              expr: >-
                (keenetic_security_ban_until_seconds - time() > 0)
                * on(device, ip) group_left(paths) keenetic_security_ip_info
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-dos-active
        title: DoS koruması devrede
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "🔴 DoS koruması devrede: {{ .Labels.device }}"
          description: "{{ .Labels.device }} internetten gelen bağlantılar eşiği aştığı için bağlantı taşması korumasını devreye aldı."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'keenetic_conntrack_lockout_active'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-client-arrived
        title: Cihaz eve geldi
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        # notify=once: telegram.yml'de "Düzeldi" mesajı göndermeyen yola gider
        labels: { severity: info, notify: once }
        annotations:
          summary: "🏠 Eve geldi: {{ .Labels.name }}"
          description: "{{ .Labels.name }} en az 4 saattir Wi-Fi'de görünmüyordu, şimdi ağa bağlandı."
        data:
          - refId: A
            relativeTimeRange: { from: 15000, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Son 5 dakikada görülen ama ondan önceki 4 saatte hiç görülmeyen Wi-Fi
              # istemcileri. Son 5 dakikaya bakmak, ilk dakikalardaki kopma ve node
              # değiştirmede ikinci bildirimi önler. Exporter ya da router o 4 saatte
              # çoğunlukla çalışmıyorsa (veri yok) herkes "geldi" sayılmasın.
              expr: >-
                group by (mac, name) (max_over_time(keenetic_wifi_client_rssi_dbm[5m]))
                unless on(mac) group by (mac) (max_over_time(keenetic_wifi_client_rssi_dbm[4h] offset 5m))
                and on() (count_over_time(keenetic_up[4h] offset 5m) > 400)
                and on() (avg_over_time(keenetic_up[4h] offset 5m) > 0.9)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-admin-login
        title: Yönetici girişi
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, notify: once }
        annotations:
          summary: "{{ if eq .Labels.scope \"internet\" }}🔴 İnternetten yönetici girişi{{ else }}🟠 Yönetici girişi (yerel ağ){{ end }}: {{ .Labels.user }} → {{ .Labels.device }}"
          description: "{{ .Labels.user }} kullanıcısı {{ .Labels.ip }}{{ if .Labels.interface }} ({{ .Labels.interface }}){{ end }} adresinden {{ .Labels.client }} ile giriş yaptı. Siz değilseniz yönetici şifresini değiştirin.{{ if eq .Labels.scope \"internet\" }} IP bilgisi: https://www.abuseipdb.com/check/{{ .Labels.ip }}{{ end }}"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Router günlüğündeki "started a user session" satırları; son 5 dakikadakiler.
              # Mobil uygulama ve Keenetic bulutu (scope="bulut") gerçek IP'yi göstermez
              # ve çok sık oturum açar; uyarı üretmez
              expr: 'keenetic_admin_login_seconds{scope!="bulut"} > time() - 300'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }


      - uid: keenetic-service-stopped
        title: Servis durdu
        condition: B
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "🔴 Servis durdu: {{ .Labels.service }} → {{ .Labels.device }}"
          description: "{{ .Labels.device }} üzerinde {{ .Labels.service }} {{ if eq .Labels.kind \"süreç\" }}süreci{{ else }}servisi{{ end }} son 1 saatte çalışıyordu, 3 dakikadır çalışmıyor."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # KeeneticOS servisi: ayarlarda açık ama durmuş. Servis olmayan süreç (ör.
              # Entware'den tailscaled): listeden çıkmış (cihaz okunabilirken).
              # İsteğe bağlı çalışanlar ve kendi uyarısı olanlar (VPN, PPPoE) hariç;
              # ayarlarda açık/kapalı bilgisi olmayan servisler (ör. ARP ping check) uyarı üretmez.
              expr: >-
                group by (device, service, kind) (
                  (keenetic_service_up{service!~"IPERF3|Reboot helper|ARP ping check|LLDP agent on .*|OpenVPN.*|Wireguard.*|PPPoE.*|.*-PPPoE.*"} == 0)
                    and on(device, service) (keenetic_service_enabled == 1)
                    and on(device, service) (max_over_time(keenetic_service_up[1h]) == 1)
                )
                or
                group by (device, service, kind) (
                  max_over_time(keenetic_service_up{kind="süreç"}[1h]) == 1
                    unless on(device, service) keenetic_service_up
                    and on(device) group by (device) (keenetic_service_up)
                )
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-service-restarted
        title: Servis yeniden başladı
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, notify: once }
        annotations:
          summary: "🟠 Servis yeniden başladı: {{ .Labels.service }} → {{ .Labels.device }}"
          description: "{{ .Labels.device }} üzerinde {{ .Labels.service }} son 10 dakikada yeniden başladı (süreç numarası değişti). Tek seferse genelde zararsızdır; sık tekrarlanıyorsa servis çöküyor olabilir."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Mesh'teki bir cihaz son 15 dk'da yeniden başladıysa hiçbiri sayılmaz: kendi
              # servisleri baştan açılır, controller açılınca mesh üyeleri de Wi-Fi ve
              # bulut servislerini yeniden başlatır. O durumu "Yeniden başladı" uyarısı bildirir
              expr: >-
                changes(keenetic_service_pid{service!~"IPERF3|Reboot helper|ARP ping check|LLDP agent on .*|Link-layer discovery observer|OpenVPN.*|Wireguard.*|PPPoE.*|.*-PPPoE.*"}[10m]) > 0
                and on() (min(keenetic_system_uptime_seconds) > 900)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: keenetic-traffic-monitor-stalled
        title: Trafik İzleme durdu
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "🟠 Trafik İzleme durdu"
          description: "İnternet trafiği varken router 30 dakikadır hiçbir uygulama trafiği saymıyor; uygulama bazında trafik panelleri boş kalır. Servis çalışıyor görünse de sayaç takılmış olabilir. Router'ı yeniden başlatmak ya da IntelliQoS'ta uygulama önceliklendirmeyi kapatıp açmak çözebilir."
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # Son 30 dakikada hiç trafikli uygulama yok, ama WAN'dan ortalama >100 kb/s indirildi
              expr: >-
                group(max_over_time(keenetic_application_active[30m]) == 0)
                and on() (sum(rate(keenetic_wan_receive_bytes_total[30m])) * 8 > 100000)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
